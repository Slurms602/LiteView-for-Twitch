# Build, test and package check on every push and pull request. Nothing is published from here.
name: ci
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  CI: "true"

jobs:
  test-linux:
    # the pure-logic tests (src/core) run on any OS; the WinForms app is compiled against .NET Framework reference assemblies
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68  # v6.0.0
        with:
          global-json-file: global.json
      - run: dotnet restore LiteView.sln --locked-mode
      - run: dotnet build LiteView.sln -c Release --no-restore -warnaserror
      - run: dotnet test LiteView.sln -c Release --no-build --logger "trx;LogFileName=tests.trx"
      - name: No credentials or tokens in the source
        run: |
          if git grep -nIE '(oauth:[a-z0-9]{20,}|refresh_token=[A-Za-z0-9]{20,}|gh[pousr]_[A-Za-z0-9]{30,}|-----BEGIN [A-Z ]*PRIVATE KEY-----)' -- . ':!tests/**'; then
            echo "::error::possible secret in the repository"; exit 1
          fi

  build-windows:
    runs-on: windows-2025
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68  # v6.0.0
        with:
          global-json-file: global.json
      - name: Vulnerable packages
        run: dotnet list LiteView.sln package --vulnerable --include-transitive
      - name: Build, test and package (portable folder, no zip)
        shell: pwsh
        run: ./build.ps1 -Version 0.0.0-ci -NoZip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: LiteView-Enhanced-ci-${{ github.sha }}
          path: dist/LiteView-Enhanced-0.0.0-ci/
          retention-days: 7
      - name: Start the app (window appears, closes cleanly), then each page with made-up data
        timeout-minutes: 25   # a stuck scene fails this step; the screenshots and logs are still uploaded
        shell: pwsh
        run: |
          $dir = 'dist/LiteView-Enhanced-0.0.0-ci'; $failed = 0
          dotnet build tests/FakeStreamlink -c Release --no-restore -o fake
          $fake = (Resolve-Path fake/streamlinkw.exe).Path
          ./tools/smoke.ps1 -Dir $dir -Out smoke/start; if ($LASTEXITCODE) { $failed++ }
          foreach ($scene in 'live', 'followed', 'recent', 'history', 'search:pix', 'browse', 'category', 'videos', 'clips', 'problem', 'chat', 'chatleft', 'chatlog', 'reply', 'picker', 'watch', 'stats', 'vod', 'preview', 'window', 'focus', 'sidemenu', 'release', 'clip', 'paused', 'offline', 'fail') {
            $vars = @{ LITEVIEW_UI_FIXTURE = '1'; LITEVIEW_UI_FIXTURE_SCENE = $scene }
            $more = @{ A11y = $scene -in 'live', 'followed', 'browse', 'category', 'videos', 'clips', 'chat', 'chatlog', 'picker' }   # also check what screen readers see
            if ($scene -in 'watch', 'stats', 'vod', 'preview', 'window', 'focus', 'sidemenu', 'release', 'clip', 'offline', 'fail', 'paused') { $vars.LITEVIEW_UI_FIXTURE_STREAMS = '1'; $more.FakeStreamlink = $fake; $more.Seconds = 20 } else { $more.Seconds = 12 }
            if ($scene -eq 'chatlog') { $more.Expect = @('chat: 8 recent messages', 'emoji: colour') }   # the history has emoji: drawn in colour
            if ($scene -eq 'reply') { $more.Expect = @('chat: 8 recent messages', 'chat: replying') }
            if ($scene -eq 'browse') { $more.A11yExpect = @("^LIST 'Browse categories' \([1-9][0-9]* items\)", '^  - Elden Ring, category') }
            if ($scene -eq 'category') { $more.A11yExpect = @("^LIST 'Browse, Music' \(2 items\)") }
            if ($scene -eq 'picker') { $more.Expect = @('picker: open'); $more.A11yExpect = @("^LIST 'Emotes' \([1-9][0-9]* items\)", "^MSAA LIST 'Emotes' \([1-9][0-9]* items\)") }
            if ($scene -eq 'paused') { $more.Expect = @('stream 1: playing', 'paused: stream stopped') }
            if ($scene -eq 'watch') { $more.Expect = @('stream 1: first frame after', "font: the window's controls use Inter too") }
            if ($scene -eq 'videos') { $more.A11yExpect = @("^LIST 'Videos of NightowlPlays' \(8 items\)", '^  - Full run, new route, past broadcast, 1:03:00') }
            if ($scene -eq 'clips') { $more.A11yExpect = @("^LIST 'Clips of NightowlPlays' \(6 items\)", '^  - that jump though, clip by ') }
            if ($scene -eq 'vod') { $more.Expect = @('video: past broadcast 5000', 'stream 1: Streamlink started \(quality .*, video from 0 s\)', 'stream 1: first frame after', 'chat replay: video 5000', 'chat replay: 30 comments from 0 s', 'chat replay: 30 comments from 590 s') }
            if ($scene -eq 'clip') { $more.Expect = @('stream 1: first frame after', 'clip: asked', 'clip: saved \([0-9.]+ MB\)') }
            if ($scene -eq 'window') { $more.Expect = @('stream 1: first frame after', 'window: pixelforge playing', 'window: mpv volume 35') }
            if ($scene -eq 'focus') { $more.Expect = @('focus: typing in the chat box: True', 'focus: the keyboard left the text box \(click in the window\)', 'focus: the keyboard left the text box \(click on the video\)') }
            if ($scene -eq 'sidemenu') { $more.Expect = @('side menu: [a-z_]+') }
            if ($scene -eq 'release') { $more.Expect = @('picture: Enhance after Ultra: the player restarts', 'stream 2: first frame after') }
            if ($scene -eq 'preview') { $more.Expect = @('preview: nightowl_plays|preview: [a-z_]+', 'preview: playing') }
            if ($scene -eq 'stats') { $more.Expect = @('stream 1: first frame after', 'stats overlay on') }
            ./tools/smoke.ps1 -Dir $dir -Out ('smoke/fixture-' + ($scene -replace '[^a-z]', '-')) -Env $vars @more
            if ($LASTEXITCODE) { $failed++ }
          }
          exit $failed
      - name: Busy chat for two minutes (memory, handles and UI lag within budget)
        if: ${{ !cancelled() }}
        timeout-minutes: 6
        shell: pwsh
        run: |
          $vars = @{ LITEVIEW_UI_FIXTURE = '1'; LITEVIEW_UI_FIXTURE_SCENE = 'stress' }
          ./tools/smoke.ps1 -Dir dist/LiteView-Enhanced-0.0.0-ci -Out smoke/fixture-stress -Env $vars -Seconds 135 -Expect 'chat stress mode: 300 messages per second', 'stress phase: scrolled back'
          $smoke = $LASTEXITCODE
          # budget from the first runs (docs/PERFORMANCE_BASELINE.md): about 4x the private memory seen, flat handles, no freeze
          ./tools/stress-check.ps1 -Log smoke/fixture-stress/liteview.log -Rate 300 -MaxPrivateMB 250 -MaxGrowthMB 30 -MaxHandleGrowth 100 -MaxGdiGrowth 20 -MaxUserGrowth 20 -MaxLagMs 250 -MinDecoded 100 -MaxRefused 0 -Out smoke/fixture-stress/stress.txt
          if ($smoke -or $LASTEXITCODE) { exit 1 }
      - name: Switching channels for two minutes (no leaks across switches)
        if: ${{ !cancelled() }}
        timeout-minutes: 6
        shell: pwsh
        run: |
          $fake = (Resolve-Path fake/streamlinkw.exe).Path
          $vars = @{ LITEVIEW_UI_FIXTURE = '1'; LITEVIEW_UI_FIXTURE_SCENE = 'switching'; LITEVIEW_UI_FIXTURE_STREAMS = '1' }
          ./tools/smoke.ps1 -Dir dist/LiteView-Enhanced-0.0.0-ci -Out smoke/fixture-switching -Env $vars -FakeStreamlink $fake -Seconds 135 -Expect 'switch 20', 'stream 20: playing', 'the last stream played until then'
          $smoke = $LASTEXITCODE
          # from the end of warm-up (3rd sample) to the end: about 20 switches, so a leak per switch adds up; the scene
          # collects garbage before each sample, so what waits for the garbage collector does not count as a leak
          ./tools/stress-check.ps1 -Log smoke/fixture-switching/liteview.log -Rate 50 -SteadySamples 10 -MaxPrivateMB 300 -MaxGrowthMB 40 -MaxHandleGrowth 40 -MaxGdiGrowth 20 -MaxUserGrowth 20 -MaxThreadGrowth 10 -MaxLagMs 1000 -MaxPlayers 2 -Out smoke/fixture-switching/stress.txt
          if ($smoke -or $LASTEXITCODE) { exit 1 }
      - name: Picture presets on a test picture (pictures for tools/preset-metrics.py)
        if: ${{ !cancelled() }}
        timeout-minutes: 6
        shell: pwsh
        run: |
          $fake = (Resolve-Path fake/streamlinkw.exe).Path
          $vars = @{ LITEVIEW_UI_FIXTURE = '1'; LITEVIEW_UI_FIXTURE_SCENE = 'presets'; LITEVIEW_UI_FIXTURE_STREAMS = '1' }
          ./tools/smoke.ps1 -Dir dist/LiteView-Enhanced-0.0.0-ci -Out smoke/fixture-presets -Env $vars -FakeStreamlink $fake -Seconds 110 -Expect 'preset shot: ultra-old'
      - name: Screenshot and logs of the start
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: smoke-${{ github.sha }}
          path: smoke/
          if-no-files-found: ignore
          retention-days: 7
