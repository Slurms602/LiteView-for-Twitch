# Once a week: list upstream commits that are newer than .upstream-reviewed in one GitHub issue.
# It only reports. Nothing is merged, picked or pushed; review with tools/upstream.sh (docs/UPSTREAM.md).
name: upstream-watch
on:
  schedule:
    - cron: "17 6 * * 1"   # Mondays 06:17 UTC
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Compare with upstream
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM: https://github.com/itsdeeezy/LiteView-for-Twitch.git
        run: bash tools/upstream-watch.sh
