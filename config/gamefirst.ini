# GameFirst guard settings (restart the guard after changes: end GameFirst.exe in Task Manager, then run it)

# Apps kept off the game's CPU die and below the game (process names, comma-separated).
# By default only LiteView's own player processes. GameFirst changes NO other program unless you list it:
# to include Chrome (and its GPU process), Chatterino, Discord or Steam's web helper, use for example
#   apps=mpv,streamlink,streamlinkw,chrome,chatterino,discord,steamwebhelper
# Changes last until that program restarts; GameFirst does not undo them when it exits.
apps=mpv,streamlink,streamlinkw

# CPU threads they may use: auto = the die WITHOUT 3D V-Cache (threads 12-23 on the 9900X3D),
# all = no pinning, or a hex mask such as FFF000
affinity=auto

# CPU priority: belownormal (game first) or normal
priority=belownormal

# GPU priority of Chrome's GPU process and mpv: belownormal or normal
gpupriority=belownormal

# Seconds between checks
interval=4
