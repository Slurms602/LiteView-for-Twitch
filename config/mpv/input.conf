# Twitch Lite video keys
MBTN_LEFT     script-message liteview-click
MBTN_LEFT_DBL script-message fs-toggle
f             script-message fs-toggle
ESC           script-message fs-exit
WHEEL_UP      add volume 5
WHEEL_DOWN    add volume -5
m             cycle mute
i             script-message liteview-stats
b             script-message liteview-compare
c             script-message liteview-chat
MBTN_BACK     script-message liteview-mouse back
MBTN_FORWARD  script-message liteview-mouse forward
GO_BACK       script-message liteview-mouse back
GO_FORWARD    script-message liteview-mouse forward
