# Twitch Lite player (mpv): cheapest smooth playback
profile=fast
hwdec=d3d11va
video-sync=audio
interpolation=no
keep-open=no
force-window=immediate
autofit=1280x720
volume=70
# screen and position: written by Twitch Lite (the screen its window is on)
include="~~/screen.conf"
# Enhance: debanding strength (switched on/off by Twitch Lite)
deband-iterations=2
deband-threshold=32
deband-range=16
deband-grain=4
